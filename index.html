<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web App</title>
    
    <!-- আপনার দেওয়া ডাইরেক্ট লিঙ্কটি এখানে যুক্ত করা হয়েছে -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1NNzaPlKu5xQDqCZSWrv8Xf-zXWAAEU_A">
    
    <style>
        /* পেজের ডিফল্ট স্পেস সরাতে এবং স্ক্রিনের মাপে সেট করতে */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            box-sizing: border-box;
        }
        
        /* iframe-কে স্ক্রিনের ১০০% জায়গা জুড়ে সেট করতে */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- আপনার Google Apps Script লিঙ্ক -->
    <iframe src="https://script.google.com/macros/s/AKfycbyGo1ntK9V_QrX1Z7aUUWDNNm_LkVTKnSV5YKdK8el8g_hQVuu_YOoRhPSrDvvVr6mv/exec" allowfullscreen></iframe>

</body>
</html>
