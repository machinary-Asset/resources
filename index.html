<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web App</title>
    <style>
        /* পেজের মার্জিন সরাতে এবং ফুলস্ক্রিন করতে */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        /* iframe-কে পুরো স্ক্রিন জুড়ে দেখানোর জন্য */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- আপনার Google Apps Script লিঙ্কটি এখানে দেওয়া হয়েছে -->
    <iframe src="https://script.google.com/macros/s/AKfycbyGo1ntK9V_QrX1Z7aUUWDNNm_LkVTKnSV5YKdK8el8g_hQVuu_YOoRhPSrDvvVr6mv/exec"></iframe>

</body>
</html>
