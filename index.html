    <style>

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* মেইন পেজে স্ক্রলবার বন্ধ করতে */

        }
        
        /* iframe-কে স্ক্রিনের ১০০% জায়গা জুড়ে সেট করতে */

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
